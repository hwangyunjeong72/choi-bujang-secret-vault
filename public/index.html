<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 가상 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    .auth { margin: 22px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; }
    .auth input { width: 100%; box-sizing: border-box; margin: 6px 0; padding: 10px; }
    .auth button { margin: 8px 5px 8px 0; padding: 10px 18px; cursor: pointer; }
    [hidden] { display: none !important; }
    li span { color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인</div>
    <h1>가상 자료실</h1>
    <p>가상 자료는 이제 정적 파일이 아닌 서버 함수에서 불러옵니다.</p>
    <div class="notice">자료 요청에는 검증된 로그인 토큰이 필요합니다.</div>
    <section class="auth">
      <p id="auth-status">로그인 상태 확인 중입니다.</p>
      <form id="login-form" hidden>
        <label>이메일 <input id="email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">로그인</button>
      </form>
      <button id="logout" hidden>로그아웃</button>
      <p id="auth-error" role="alert"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.117.2';
    const client = createClient(
      'https://nfhfbhignmrgutjlxpvw.supabase.co',
      'sb_publishable__2PHW4q7ozgVNusOAIjgJA_MbAdtCpc'
    );
    const list = document.querySelector('#notes');
    const form = document.querySelector('#login-form');
    const logout = document.querySelector('#logout');
    const status = document.querySelector('#auth-status');
    const errorBox = document.querySelector('#auth-error');
    let refreshSequence = 0;

    async function show(session) {
      const sequence = ++refreshSequence;
      const user = session?.user;
      status.textContent = user ? '로그인됨: ' + (user.email || '인증된 계정') : '로그아웃 상태';
      form.hidden = Boolean(user);
      logout.hidden = !user;
      if (!session?.access_token) {
        list.replaceChildren();
        return;
      }
      list.textContent = '가상 자료를 불러오는 중입니다.';
      try {
        const response = await fetch('/api/notes', {
          headers: { Authorization: 'Bearer ' + session.access_token },
          cache: 'no-store'
        });
        if (!response.ok) throw new Error('자료 접근 거부 (HTTP ' + response.status + ')');
        const data = await response.json();
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (sequence !== refreshSequence) return;
        list.replaceChildren(...data.notes.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.content;
          item.append(title, content);
          return item;
        }));
      } catch (error) {
        if (sequence === refreshSequence) list.textContent = error.message;
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      errorBox.textContent = '';
      const email = document.querySelector('#email').value.trim();
      const passwordInput = document.querySelector('#password');
      const password = passwordInput.value;
      passwordInput.value = '';
      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) errorBox.textContent = '로그인 실패: ' + error.message;
    });
    logout.addEventListener('click', async () => {
      errorBox.textContent = '';
      const { error } = await client.auth.signOut();
      if (error) errorBox.textContent = '로그아웃 실패: ' + error.message;
    });
    client.auth.onAuthStateChange((_event, session) => {
      setTimeout(() => { void show(session); }, 0);
    });
    const { data: { session }, error } = await client.auth.getSession();
    if (error) errorBox.textContent = '로그인 상태 오류: ' + error.message;
    await show(session);
  </script>
</body>
</html>
